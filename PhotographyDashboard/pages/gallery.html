<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery — Photography Dashboard</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" />
  <style>
    .gallery-filters { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px; }
    .filter-btn { padding:6px 14px; border:1px solid #ddd; border-radius:20px; background:#fff; font-size:13px; cursor:pointer; color:#555; transition:all .15s; }
    .filter-btn.active, .filter-btn:hover { background:#E6F1FB; border-color:#378ADD; color:#185FA5; }
    .gallery-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:12px; }
    .gallery-item { border-radius:10px; overflow:hidden; border:1px solid #eee; background:#f5f5f3; aspect-ratio:4/3; display:flex; align-items:center; justify-content:center; position:relative; cursor:pointer; }
    .gallery-item:hover .gallery-overlay { opacity:1; }
    .gallery-placeholder { font-size:36px; color:#ccc; }
    .gallery-overlay { position:absolute; inset:0; background:rgba(24,95,165,0.7); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; opacity:0; transition:opacity .2s; color:#fff; font-size:12px; }
    .gallery-overlay .ti { font-size:22px; }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-logo"><i class="ti ti-aperture"></i><span>LensStudio</span></div>
    <nav class="sidebar-nav">
      <a href="../index.html" class="nav-item"><i class="ti ti-layout-dashboard"></i> Dashboard</a>
      <a href="gallery.html" class="nav-item active"><i class="ti ti-photo"></i> Gallery</a>
      <a href="bookings.html" class="nav-item"><i class="ti ti-calendar"></i> Bookings</a>
      <a href="portfolio.html" class="nav-item"><i class="ti ti-briefcase"></i> Portfolio</a>
      <a href="#" class="nav-item"><i class="ti ti-users"></i> Clients</a>
      <a href="#" class="nav-item"><i class="ti ti-settings"></i> Settings</a>
    </nav>
    <div class="sidebar-user">
      <div class="avatar">TM</div>
      <div class="user-info"><p class="user-name">Thamizh M.</p><p class="user-role">Photographer</p></div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h1 class="page-title">Gallery</h1>
        <p class="page-sub">14,200 photos across 248 shoots</p>
      </div>
      <div class="topbar-actions">
        <button class="btn-icon" aria-label="Notifications"><i class="ti ti-bell"></i></button>
        <button class="btn-primary"><i class="ti ti-upload"></i> Upload Photos</button>
      </div>
    </header>

    <div class="card">
      <div class="gallery-filters">
        <button class="filter-btn active">All</button>
        <button class="filter-btn">Wedding</button>
        <button class="filter-btn">Portrait</button>
        <button class="filter-btn">Commercial</button>
        <button class="filter-btn">Nature</button>
        <button class="filter-btn">Fashion</button>
        <button class="filter-btn">Event</button>
      </div>
      <div class="gallery-grid">
        <!-- Placeholder gallery items; replace src with real image paths -->
        <div class="gallery-item">
          <i class="ti ti-photo gallery-placeholder" aria-hidden="true"></i>
          <div class="gallery-overlay"><i class="ti ti-eye"></i><span>View</span></div>
        </div>
        <div class="gallery-item">
          <i class="ti ti-heart gallery-placeholder" style="color:#F0997B;" aria-hidden="true"></i>
          <div class="gallery-overlay"><i class="ti ti-eye"></i><span>View</span></div>
        </div>
        <div class="gallery-item">
          <i class="ti ti-tree gallery-placeholder" style="color:#5DCAA5;" aria-hidden="true"></i>
          <div class="gallery-overlay"><i class="ti ti-eye"></i><span>View</span></div>
        </div>
        <div class="gallery-item">
          <i class="ti ti-building gallery-placeholder" style="color:#85B7EB;" aria-hidden="true"></i>
          <div class="gallery-overlay"><i class="ti ti-eye"></i><span>View</span></div>
        </div>
        <div class="gallery-item">
          <i class="ti ti-users gallery-placeholder" style="color:#AFA9EC;" aria-hidden="true"></i>
          <div class="gallery-overlay"><i class="ti ti-eye"></i><span>View</span></div>
        </div>
        <div class="gallery-item">
          <i class="ti ti-shirt gallery-placeholder" style="color:#F4C0D1;" aria-hidden="true"></i>
          <div class="gallery-overlay"><i class="ti ti-eye"></i><span>View</span></div>
        </div>
        <div class="gallery-item">
          <i class="ti ti-sun gallery-placeholder" style="color:#FAC775;" aria-hidden="true"></i>
          <div class="gallery-overlay"><i class="ti ti-eye"></i><span>View</span></div>
        </div>
        <div class="gallery-item">
          <i class="ti ti-camera gallery-placeholder" style="color:#888;" aria-hidden="true"></i>
          <div class="gallery-overlay"><i class="ti ti-eye"></i><span>View</span></div>
        </div>
        <div class="gallery-item">
          <i class="ti ti-moon gallery-placeholder" style="color:#7F77DD;" aria-hidden="true"></i>
          <div class="gallery-overlay"><i class="ti ti-eye"></i><span>View</span></div>
        </div>
      </div>
    </div>
  </main>

  <script>
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      });
    });
  </script>
</body>
</html>
